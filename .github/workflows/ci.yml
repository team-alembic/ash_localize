name: CI

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ash-ci:
    uses: ash-project/ash/.github/workflows/ash-ci.yml@main
    with:
      # No data layer of our own — the test suite runs on ETS.
      postgres: false
      sqlite: false

      # Nothing to check yet: no Spark DSL extension, and sobelow scans for
      # Phoenix web vulnerabilities in a package with no web layer. Turn both on
      # when the Phoenix bridge and the translations DSL land.
      spark-formatter: false
      spark-cheat-sheets: false
      sobelow: false

      # Not published, and there is no HEX_API_KEY or Pages set up for a private
      # repository. Flip both when the first release is ready.
      release: false
      publish-docs: false

      community-files: false
      conventional-commit: false
      changelog-lint: false
      igniter-upgrade: false
      reuse: false

    # Must be a superset of what ash-ci.yml's jobs declare, even for jobs that
    # will not run — GitHub validates permissions at startup, before evaluating
    # any `if:`. Granting less fails the whole run before a single job starts.
    permissions:
      contents: write
      pages: write
      id-token: write
      security-events: write
